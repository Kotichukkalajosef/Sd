(function(){

function cyl(rt,rb,h,x,y,z,c,p,ax,o,seg){const m=add(new THREE.CylinderGeometry(rt,rb,h,seg||32),M(c,o),x,y,z,p);if(ax=='x')m.rotation.z=Math.PI/2;if(ax=='z')m.rotation.x=Math.PI/2;return m}
function pipe(pts,r,c,o){return add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',.05),64,r,12),M(c,o),0,0,0)}

// ===== REALISTIC GROUND: grass block, crushed-stone yard, concrete pads, asphalt roads =====

function ctex(n,draw){const c=document.createElement('canvas');c.width=c.height=n;draw(c.getContext('2d'),n);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=R.capabilities.getMaxAnisotropy();return t}
const blob=(g,x,y,r,rgb,a)=>{const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${rgb},${a})`);q.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r)};

  for(let i=0;i<45;i++)blob(g,rnd(0,n),rnd(0,n),rnd(30,90),Math.random()<.3?'150,140,70':'40,90,30',.32);

  for(let i=0;i<6;i++)blob(g,rnd(0,n),rnd(0,n),rnd(12,30),'95,70,40',.5)});

const gravelT=(base,lo,hi)=>ctex(512,(g,n)=>{g.fillStyle=base;g.fillRect(0,0,n,n);

  for(let i=0;i<14;i++)blob(g,rnd(0,n),rnd(0,n),rnd(20,60),'60,55,50',.12);

const gravel=gravelT('#8a867d',32,70),gravelW=gravelT('#b4b1a8',55,85);

// scatter: rocks, grass tufts, bushes, trees
const D=new THREE.Object3D(),C=new THREE.Color();

  D.position.set(x,-.3+s*.3,z);D.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));D.scale.set(s*rnd(.9,1.4),s*rnd(.5,.9),s*rnd(.9,1.4));m.setColorAt(i,C.setHSL(rnd(.06,.12),rnd(0,.1),rnd(.3,.6)))},true);
rk.instanceColor.needsUpdate=true;

tf.instanceColor.needsUpdate=true;
const bs=inst(new THREE.IcosahedronGeometry(1,1),M(0xffffff,{roughness:1,metalness:0}),90,(i,m)=>{const[x,z]=i<60?edgeSpot(28):spot(),s=rnd(1,2.4);
  D.position.set(x,-.3+s*.5,z);D.rotation.set(0,rnd(0,3),0);D.scale.set(s*rnd(1,1.5),s*rnd(.6,1),s*rnd(1,1.5));m.setColorAt(i,C.setHSL(rnd(.22,.32),rnd(.4,.6),rnd(.12,.24)))},true);
bs.instanceColor.needsUpdate=true;
for(let i=0;i<28;i++){const[x,z]=i<20?edgeSpot(40):spot(),s=rnd(.8,1.6),hh=rnd(.2,.32);
  cyl(.35*s,.5*s,3.4*s,x,-.3+1.7*s,z,0x5a4028,null,'',{roughness:1,metalness:0},8);
  for(let k=0;k<3;k++)add(new THREE.IcosahedronGeometry(rnd(1.8,2.6)*s,1),M(new THREE.Color().setHSL(hh,.5,rnd(.16,.26)),{roughness:1,metalness:0}),x+rnd(-1,1)*s,-.3+(3.6+k*1.3)*s,z+rnd(-1,1)*s)}
// perimeter security fence
(function(){const x0=-108,x1=118,z0=-98,z1=82,st=7.5,P=[];
  for(let x=x0;x<=x1;x+=st)P.push([x,z0],[x,z1]);for(let z=z0+st;z<z1;z+=st)P.push([x0,z],[x1,z]);
  inst(new THREE.BoxGeometry(.25,3.2,.25),M(0x7d868e),P.length,i=>{D.position.set(P[i][0],1.6,P[i][1]);D.rotation.set(0,0,0);D.scale.set(1,1,1)},true);
  const fm={transparent:true,opacity:.22,depthWrite:false,roughness:.5};
  [z0,z1].forEach(z=>{box(x1-x0,2.6,.05,(x0+x1)/2,1.7,z,0xcfd6dc,null,fm);box(x1-x0,.12,.12,(x0+x1)/2,3.1,z,0x7d868e)});
  [x0,x1].forEach(x=>{box(.05,2.6,z1-z0,x,1.7,(z0+z1)/2,0xcfd6dc,null,fm);box(.12,.12,z1-z0,x,3.1,(z0+z1)/2,0x7d868e)})})();

  ring(8.9,52,x,z,.35,0x9c9c96);
  const dk=new THREE.Mesh(new THREE.CylinderGeometry(11.9,11.9,5,48,1,true),M(0x1d2226,{roughness:1,metalness:0,side:THREE.DoubleSide}));dk.position.set(x,2.5,z);scene.add(dk);
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2;cyl(.35,.35,5.2,x+Math.cos(a)*11.9,2.6,z+Math.sin(a)*11.9,0xb0b0aa,null,'',conc,8)}
  cyl(14,14,.5,x,.2,z,0x2f86a8,null,'',{roughness:.2,metalness:.1,transparent:true,opacity:.9},48);

}

const tex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const parts=[];

function spawn(e){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:e.col,transparent:true,opacity:.5,depthWrite:false}));
  s.position.set(e.x+(Math.random()-.5)*2,e.y,e.z+(Math.random()-.5)*2);s.scale.setScalar(e.s);s.userData={e,a:0,vx:.15+Math.random()*.05,vz:(Math.random()-.5)*e.sp};scene.add(s);parts.push(s)}

// ===== CAMERA, 360° ROTATION, CLICK-TO-ZOOM =====
const TAU=Math.PI*2;
let tgt=new THREE.Vector3(-5,25,-5),th=.9,ph=1.15,rad=290;
let gt=tgt.clone(),gth=th,gph=ph,grad=rad,auto=true;
function setView(v){gt.set(...v[0]);gth=v[1]+TAU*Math.round((th-v[1])/TAU);gph=v[2];grad=v[3]}
const OV=[[-5,25,-5],.9,1.15,290];
// clickable zones: b = [x0,x1,y0,y1,z0,z1], v = camera view
const Z={
 chimney:{n:'Chimney – 125 m stack',d:'Carries cleaned flue gas from the ID fans up to the atmosphere. Red and white bands, service platforms, aviation beacon.',b:[-93,-79,0,135,6,20],v:[[-86,60,13],.4,1.3,165]},
 esp:{n:'ESP, ID Fans & Gas Ducts',d:'Electrostatic precipitators remove fly ash from the flue gas before the induced-draft fans push it to the chimney.',b:[-70,-30,0,22,3,23],v:[[-52,8,13],.6,1.1,80]},
 tg:{n:'TG Floor – Turbine Generator Hall',d:'HP, IP and LP turbines, generator and exciter on the operating deck. Condenser below the deck, deaerator and overhead EOT crane.',b:[2,46,0,33,-12,12],v:[[26,14,0],-.6,1.0,58]},
 boiler:{n:'Boiler (Steam Generator)',d:'Furnace, steam drum, superheater / reheater / economizer back-pass, air preheaters and the main steam line to the turbine.',b:[-36,-3,0,66,-16,12],v:[[-20,30,0],.5,1.2,105]},
 coal:{n:'Coal Handling',d:'Coal stockpile, inclined conveyor gallery and the boiler coal bunker.',b:[-27,-13,0,48,14,66],v:[[-20,18,40],-.7,1.2,90]},
 ct1:{n:'Cooling Tower 1',d:'Natural-draft cooling tower. Hot condenser water is cooled here and recirculated.',b:[17,51,0,56,-69,-35],v:[[34,25,-52],-.5,1.2,90]},
 ct2:{n:'Cooling Tower 2',d:'Natural-draft cooling tower with steam plume.',b:[53,87,0,56,-69,-35],v:[[70,25,-52],-.5,1.2,90]},
 sw:{n:'Switchyard & GT Transformers',d:'Generator transformers and gantries that evacuate power to the grid.',b:[48,102,0,26,9,51],v:[[74,10,30],.5,1.15,90]},
 ctl:{n:'Control & Admin Building',d:'Central control room and administration offices.',b:[10,34,0,13,33,47],v:[[22,5,40],.6,1.2,55]}
};
const ZK=Object.keys(Z);
const V={over:OV,boiler:Z.boiler.v,tg:Z.tg.v,stack:Z.chimney.v,ct:[[52,25,-52],-.5,1.25,150]};
// info card
const card=document.createElement('div');card.style.cssText='position:fixed;left:12px;bottom:12px;max-width:min(340px,86vw);background:rgba(10,16,24,.88);color:#e6edf5;border-left:4px solid #e8a317;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.45;display:none';
card.innerHTML='<b style="font-size:13px;color:#fff"></b><div style="margin:4px 0 8px"></div><button style="background:#e8a317;border:0;border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer">← Back to overview</button>';
document.body.appendChild(card);
const cT=card.children[0],cD=card.children[1];
let cur=null;
function focus(k){cur=k;const z=Z[k];setView(z.v);cT.textContent=z.n;cD.textContent=z.d;card.style.display='block'}
function overview(){cur=null;setView(OV);card.style.display='none'}
card.children[2].onclick=overview;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const k=b.dataset.v;if(k=='over')overview();else if(k=='boiler')focus('boiler');else if(k=='tg')focus('tg');else if(k=='stack')focus('chimney');else{cur=null;card.style.display='none';setView(V.ct)}});
// picking
const rc=new THREE.Raycaster(),nd=new THREE.Vector2();rc.camera=cam;let pick=null;
function pickZone(e){
  if(!pick){pick=[];scene.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&o!==grassBlock)pick.push(o)})}
  nd.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(nd,cam);
  for(const h of rc.intersectObjects(pick,false)){const p=h.point,m=1.5;
    for(const k of ZK){const b=Z[k].b;if(p.x>b[0]-m&&p.x<b[1]+m&&p.y>b[2]-m&&p.y<b[3]+m&&p.z>b[4]-m&&p.z<b[5]+m)return k}}
  return null}
let drag=0,px=0,py=0,sx=0,sy=0,pan=false,hv=0;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{drag=1;pan=e.button==2||e.shiftKey;px=sx=e.clientX;py=sy=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointerup',e=>{drag=0;cv.style.cursor='grab';
  if(e.button===0&&Math.hypot(e.clientX-sx,e.clientY-sy)<5){const k=pickZone(e);if(k&&k!==cur)focus(k)}});
cv.addEventListener('pointermove',e=>{
  if(!drag){if(e.pointerType==='mouse'&&performance.now()-hv>70){hv=performance.now();cv.style.cursor=pickZone(e)?'pointer':'grab'}return}
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(pan){const k=grad*.0016,r=new THREE.Vector3();cam.getWorldDirection(r);r.cross(new THREE.Vector3(0,1,0)).normalize();gt.addScaledVector(r,-dx*k);gt.y+=dy*k}
  else{gth-=dx*.006;gph=Math.min(1.5,Math.max(.15,gph-dy*.006))}});
cv.addEventListener('wheel',e=>{e.preventDefault();grad=Math.min(520,Math.max(15,grad*(1+e.deltaY*.001)))},{passive:false});
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)grad=Math.min(520,Math.max(15,grad*pd/d));pd=d}},{passive:true});
cv.addEventListener('touchend',()=>pd=0);
let roofOn=true,labOn=true;

document.getElementById('rot').onclick=function(){auto=!auto;this.classList.toggle('on',auto);this.textContent='360° Rotate: '+(auto?'On':'Off')};
label('Chimney (125 m)',CX,H,CZ);label('ESP',-48,17,13);label('ID Fans',-66,7,6.5);label('Boiler',-20,50,0);label('Steam Drum',-20,62,0);
label('Main Steam Line',0,44,0);label('APH',-7,9,3.5);label('Coal Bunker',-20,48,20);label('Coal Stockpile',-20,10,56);label('HP',10.5,17,0);label('IP',17,17,0);label('LP',25,18,0);
label('Generator',35,17,0);label('Condenser',25,1,5);label('Deaerator',20,27,-7.5);label('EOT Crane',10,28,0);label('TG Floor',40,11,8);
label('Cooling Tower 1',34,54,-52);label('Cooling Tower 2',70,54,-52);label('Switchyard / GT',70,9,36);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=clk.getDelta(),t=clk.elapsedTime;
  tgt.lerp(gt,.06);th+=(gth-th)*.06;ph+=(gph-ph)*.06;rad+=(grad-rad)*.06;
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
  if(auto&&!drag)gth+=dt*.3;rot.rotation.x+=dt*14;crane.position.x=24+Math.sin(t*.25)*14;
  beacon.material.color.setHex(Math.sin(t*3)>0?0xff2020:0x330000);
  ems.forEach(e=>{e.t+=e.rate*60*dt;while(e.t>1){e.t-=1;spawn(e)}});
  for(let i=parts.length-1;i>=0;i--){const s=parts[i],u=s.userData;u.a++;s.position.x+=u.vx;s.position.y+=u.e.vy;s.position.z+=u.vz;
    s.scale.setScalar(s.scale.x+u.e.grow);s.material.opacity=.5*(1-u.a/u.e.life);
    if(u.a>=u.e.life){scene.remove(s);s.material.dispose();parts.splice(i,1)}}
  if(labOn)labels.forEach(l=>{const p=l.v.clone().project(cam);if(p.z>1||p.z<-1){l.d.style.display='none';return}
    l.d.style.display='';l.d.style.left=(p.x*.5+.5)*innerWidth+'px';l.d.style.top=(-p.y*.5+.5)*innerHeight+'px'});
  R.render(scene,cam)}
loop();
