<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTorque" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#081A2D"/><stop offset="100%" stop-color="#0F385F"/></linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CFD9E4"/><stop offset="50%" stop-color="#8EA6BF"/><stop offset="100%" stop-color="#55718D"/></linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5B94A"/><stop offset="100%" stop-color="#FFD68A"/></linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgTorque)"/>

  <!-- Background Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/><line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Left: 700 Bar Hydraulic Power Pack Skid -->
  <g transform="translate(100, 160)">
    <!-- Skid frame -->
    <rect x="0" y="40" width="190" height="200" rx="12" fill="#0A223B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="55" width="160" height="170" rx="8" fill="#061627"/>

    <!-- Oil Reservoir / Motor -->
    <rect x="30" y="100" width="130" height="110" rx="6" fill="#184E77" stroke="#4B779E" stroke-width="1.5"/>
    <line x1="30" y1="130" x2="160" y2="130" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 2"/>

    <!-- Dual Gauge Cluster -->
    <circle cx="95" cy="80" r="32" fill="#0B2038" stroke="#E2EDF8" stroke-width="2"/>
    <circle cx="95" cy="80" r="28" fill="#FFFFFF"/>
    <circle cx="95" cy="80" r="2" fill="#000000"/>
    <!-- Needle pointing to 680 bar -->
    <line x1="95" y1="80" x2="112" y2="68" stroke="#EF4444" stroke-width="2.5"/>
    <text x="95" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0A223B" font-weight="700" text-anchor="middle">700 BAR</text>

    <!-- Skid Handles -->
    <path d="M -10 90 L 0 90 L 0 170 L -10 170" fill="none" stroke="#F5B94A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 200 90 L 190 90 L 190 170 L 200 170" fill="none" stroke="#F5B94A" stroke-width="4" stroke-linecap="round"/>

    <!-- Skid label -->
    <rect x="35" y="215" width="120" height="20" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="95" y="229" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" font-weight="700" text-anchor="middle">HYDRAULIC PUMP UNIT</text>
  </g>

  <!-- High-Pressure Twin Flexible Hydraulic Hoses -->
  <path d="M 270 270 C 350 270, 370 230, 440 230" fill="none" stroke="#F5B94A" stroke-width="7" stroke-linecap="round"/>
  <path d="M 270 282 C 350 282, 370 242, 440 242" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 270 282 C 350 282, 370 242, 440 242" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Right: Low-Profile Hydraulic Torque Wrench Assembly -->
  <g transform="translate(450, 150)">
    <!-- Flange Stud Plate background -->
    <rect x="50" y="40" width="220" height="210" rx="10" fill="#0B2038" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Stud / Hex Nut -->
    <circle cx="160" cy="145" r="54" fill="#184E77" stroke="#94A3B8" stroke-width="2"/>
    <!-- 12-point socket inner drive -->
    <polygon points="160,105 180,113 194,127 200,145 194,163 180,177 160,185 140,177 126,163 120,145 126,127 140,113" fill="#0A223B" stroke="#F5B94A" stroke-width="2"/>
    <circle cx="160" cy="145" r="22" fill="#334155" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Torque Wrench Body (Al-Ti Alloy) -->
    <path d="M 0 70 L 110 70 L 160 95 L 210 135 L 210 175 L 140 195 L 40 130 L 0 130 Z" fill="url(#metalGrad)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Cylinder Barrel & Retract Port -->
    <rect x="10" y="80" width="80" height="40" rx="6" fill="#1E3A5F" stroke="#F5B94A" stroke-width="1.5"/>
    <circle cx="20" cy="95" r="6" fill="#EF4444"/>
    <circle cx="20" cy="108" r="6" fill="#38BDF8"/>

    <!-- Reaction Arm -->
    <path d="M 120 185 L 140 230 L 70 230 L 60 175 Z" fill="#0F2B48" stroke="#94A3B8" stroke-width="2"/>
    <text x="105" y="222" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F5B94A">REACTION BOOT</text>

    <!-- Digital Load / Torque Readout Pill -->
    <rect x="40" y="270" width="240" height="48" rx="8" fill="rgba(6,22,39,0.92)" stroke="#52C41A" stroke-width="1.5"/>
    <text x="160" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52C41A" text-anchor="middle">CALIBRATED TORQUE OUTPUT</text>
    <text x="160" y="308" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">18,500 Nm (TOLERANCE ±2%)</text>
  </g>

  <!-- Identification Header Badge -->
  <rect x="40" y="40" width="320" height="52" rx="10" fill="rgba(11,32,56,0.9)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="1.5">STORE MACHINERY &amp; TOOLING</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Hydraulic Torque Wrench (700 Bar)</text>
</svg>
