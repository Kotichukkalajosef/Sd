<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrib" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#081A2D"/><stop offset="100%" stop-color="#113F67"/></linearGradient>
    <linearGradient id="boxMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2D4A6B"/><stop offset="100%" stop-color="#142C44"/></linearGradient>
    <linearGradient id="dialGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E2EDF8"/></linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5B94A"/><stop offset="100%" stop-color="#D99B26"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCrib)"/>

  <!-- Heavy Tool Cabinet / Flight Case Base -->
  <rect x="70" y="130" width="660" height="310" rx="16" fill="url(#boxMetal)" stroke="#38BDF8" stroke-width="2"/>
  <rect x="85" y="145" width="630" height="280" rx="10" fill="#061627"/>

  <!-- Cabinet Corner Protectors -->
  <polygon points="70,130 100,130 70,160" fill="#F5B94A"/>
  <polygon points="730,130 700,130 730,160" fill="#F5B94A"/>
  <polygon points="70,440 100,440 70,410" fill="#F5B94A"/>
  <polygon points="730,440 700,440 730,410" fill="#F5B94A"/>

  <!-- Instrument 1: Dial Test Indicator with Articulated Magnetic Base (Left) -->
  <g transform="translate(120, 170)">
    <!-- Heavy Magnetic Base -->
    <rect x="30" y="150" width="70" height="55" rx="6" fill="#184E77" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="65" cy="177" r="10" fill="#0A223B" stroke="#F5B94A" stroke-width="1.5"/>
    <text x="65" y="181" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F5B94A" font-weight="700" text-anchor="middle">ON</text>

    <!-- Articulated Chrome Arm -->
    <line x1="65" y1="150" x2="65" y2="60" stroke="#CFD9E4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="100" r="8" fill="#F5B94A"/>
    <line x1="65" y1="60" x2="115" y2="40" stroke="#CFD9E4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="65" cy="60" r="7" fill="#F5B94A"/>

    <!-- Dial Indicator Bezel & Face -->
    <circle cx="140" cy="30" r="34" fill="#0A223B" stroke="#F5B94A" stroke-width="2"/>
    <circle cx="140" cy="30" r="29" fill="url(#dialGrad)"/>
    <!-- Measurement ticks -->
    <circle cx="140" cy="30" r="2" fill="#000000"/>
    <line x1="140" y1="30" x2="152" y2="18" stroke="#EF4444" stroke-width="2"/>
    <!-- Plunger & Contact Point -->
    <line x1="140" y1="64" x2="140" y2="105" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="140" cy="105" r="3" fill="#E2E8F0"/>

    <text x="65" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" text-anchor="middle">0.001 mm DIAL GAUGE</text>
  </g>

  <!-- Instrument 2: Precision Outside Micrometer & Bridge Gauge (Center) -->
  <g transform="translate(320, 180)">
    <!-- Micrometer C-Frame -->
    <path d="M 40 40 C 0 40, -10 120, 40 130 L 110 130 C 140 130, 140 40, 110 40" fill="none" stroke="#F5B94A" stroke-width="14" stroke-linecap="round"/>
    <!-- Anvil & Spindle -->
    <line x1="42" y1="85" x2="65" y2="85" stroke="#E2EDF8" stroke-width="8"/>
    <line x1="95" y1="85" x2="65" y2="85" stroke="#EF4444" stroke-width="3" stroke-dasharray="2 2"/>
    <rect x="95" y="78" width="55" height="14" rx="2" fill="#CFD9E4" stroke="#475569" stroke-width="1"/>
    <!-- Thimble & Ratchet Stop -->
    <rect x="150" y="74" width="38" height="22" rx="3" fill="#1E3A5F" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="160" y1="74" x2="160" y2="96" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="170" y1="74" x2="170" y2="96" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="188" y="78" width="16" height="14" rx="2" fill="#F5B94A"/>

    <text x="80" y="165" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" text-anchor="middle">0-150 mm MICROMETER</text>

    <!-- Feeler Gauge Fan Pack -->
    <g transform="translate(10, 175)">
      <rect x="30" y="0" width="30" height="24" rx="4" fill="#334155"/>
      <path d="M 60 12 L 140 -8" stroke="#CFD9E4" stroke-width="3" stroke-linecap="round"/>
      <path d="M 60 12 L 145 6" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 60 12 L 138 20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <path d="M 60 12 L 130 32" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <text x="65" y="44" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">FEELER GAUGE SET (0.03 - 1.00 mm)</text>
    </g>
  </g>

  <!-- Instrument 3: Bore Gauge & Calibration Certificate Dossier (Right) -->
  <g transform="translate(560, 170)">
    <!-- Certificate Card -->
    <rect x="10" y="15" width="130" height="175" rx="8" fill="#0A223B" stroke="#52C41A" stroke-width="1.5"/>
    <rect x="22" y="28" width="106" height="18" rx="4" fill="rgba(82,196,26,0.2)"/>
    <text x="75" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#52C41A" font-weight="700" text-anchor="middle">CALIBRATION CERT</text>
    <line x1="25" y1="58" x2="125" y2="58" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="25" y1="72" x2="110" y2="72" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="25" y1="86" x2="120" y2="86" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="25" y1="100" x2="95" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- Gold Hologram Seal -->
    <circle cx="75" cy="140" r="22" fill="none" stroke="#F5B94A" stroke-width="2"/>
    <circle cx="75" cy="140" r="17" fill="url(#brassGrad)"/>
    <text x="75" y="143" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0A223B" font-weight="800" text-anchor="middle">NABL TRACE</text>
    
    <text x="75" y="210" font-family="'JetBrains Mono', monospace" font-size="9" fill="#52C41A" text-anchor="middle">TRACEABLE CALIBRATION</text>
  </g>

  <!-- Header Badge -->
  <rect x="40" y="40" width="330" height="52" rx="10" fill="rgba(11,32,56,0.9)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" letter-spacing="1.5">STORE MACHINERY &amp; TOOLING</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Calibrated Metrology Tool Crib</text>
</svg>
