<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#081A2D"/><stop offset="100%" stop-color="#144673"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Dynamic Balancing Polar Vector Chart -->
  <g transform="translate(400, 270)">
    <!-- Concentric Velocity Rings (mm/s RMS) -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(245,185,74,0.3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="rgba(82,196,26,0.1)" stroke="#52C41A" stroke-width="2"/>
    
    <!-- Cross hairs -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    
    <!-- Initial Unbalance Vector (Red) -->
    <line x1="0" y1="0" x2="95" y2="-85" stroke="#FF4D4D" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="95" cy="-85" r="7" fill="#FF4D4D"/>
    <text x="110" y="-90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF4D4D">INITIAL: 7.8 mm/s</text>
    
    <!-- Final Balanced Vector (Green) -->
    <line x1="0" y1="0" x2="-18" y2="12" stroke="#52C41A" stroke-width="4"/>
    <circle cx="-18" cy="12" r="7" fill="#52C41A"/>
    <text x="-135" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52C41A">FINAL: 0.85 mm/s (ISO A)</text>
  </g>

  <!-- Badge -->
  <rect x="40" y="40" width="270" height="52" rx="10" fill="rgba(11,32,56,0.85)" stroke="rgba(245,185,74,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5B94A" letter-spacing="1.5">DYNAMIC ROTOR BALANCING</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">ISO 1940 Grade G2.5 Standard</text>
</svg>
