<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B2038"/><stop offset="100%" stop-color="#113F67"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D5A85"/><stop offset="50%" stop-color="#4C82B5"/><stop offset="100%" stop-color="#1A3B5C"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5B94A"/><stop offset="100%" stop-color="#D99B26"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Outer Barrel Casing Cross Section -->
  <rect x="80" y="140" width="340" height="220" rx="14" fill="url(#barrel)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <rect x="90" y="155" width="310" height="190" rx="10" fill="#07192C"/>
  <circle cx="240" cy="110" r="30" fill="none" stroke="#F5B94A" stroke-width="8"/>
  <rect x="232" y="110" width="16" height="32" fill="#F5B94A"/>
  
  <!-- Extraction Pullout Rig Rails -->
  <line x1="380" y1="230" x2="740" y2="230" stroke="#F5B94A" stroke-width="4" stroke-dasharray="10 5"/>
  <line x1="380" y1="270" x2="740" y2="270" stroke="#F5B94A" stroke-width="4" stroke-dasharray="10 5"/>
  
  <!-- Inner Cartridge Bundle (Being Extracted) -->
  <g transform="translate(340, 165)">
    <!-- Shaft Center -->
    <rect x="0" y="70" width="380" height="20" rx="5" fill="#E2EDF8"/>
    <!-- Multi-stage Impellers -->
    <rect x="60" y="20" width="32" height="120" rx="6" fill="url(#inner)"/>
    <rect x="110" y="20" width="32" height="120" rx="6" fill="url(#inner)"/>
    <rect x="160" y="20" width="32" height="120" rx="6" fill="url(#inner)"/>
    <rect x="210" y="20" width="32" height="120" rx="6" fill="url(#inner)"/>
    <rect x="260" y="20" width="32" height="120" rx="6" fill="url(#inner)"/>
    <rect x="310" y="10" width="38" height="140" rx="6" fill="#8DA5BE" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Stage guide rings -->
    <line x1="40" y1="80" x2="350" y2="80" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <!-- Pulling Jack Screw -->
  <rect x="710" y="210" width="50" height="80" rx="8" fill="#F5B94A"/>
  <circle cx="735" cy="250" r="14" fill="#0B2038"/>
  
  <!-- Badge -->
  <rect x="40" y="40" width="250" height="52" rx="10" fill="rgba(11,32,56,0.85)" stroke="rgba(245,185,74,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5B94A" letter-spacing="1.5">TDBFP EXTRACTION</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Inner Cartridge Renewal</text>
</svg>
