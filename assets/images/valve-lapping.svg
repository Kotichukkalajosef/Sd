<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E2843"/><stop offset="100%" stop-color="#144673"/></linearGradient>
    <radialGradient id="lapGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFD175" stop-opacity="0.8"/><stop offset="100%" stop-color="#F5B94A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Valve Body Cross-Section Contour -->
  <path d="M 160 400 L 160 300 Q 160 220 260 220 L 320 220 L 320 120 L 480 120 L 480 220 L 540 220 Q 640 220 640 300 L 640 400" fill="none" stroke="#668CAE" stroke-width="8"/>
  <path d="M 200 420 L 600 420" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- In-situ Lapping Mandrel / Spindle -->
  <rect x="385" y="40" width="30" height="240" fill="#E2EDF8" stroke="#33597D" stroke-width="2"/>
  <rect x="340" y="20" width="120" height="30" rx="4" fill="#F5B94A"/>
  
  <!-- Optical Lapping Head / Grinding Disc -->
  <ellipse cx="400" cy="275" rx="110" ry="32" fill="#254F75" stroke="#E2EDF8" stroke-width="4"/>
  <ellipse cx="400" cy="275" rx="90" ry="24" fill="#F5B94A" opacity="0.9"/>
  <circle cx="400" cy="275" r="95" fill="url(#lapGlow)"/>
  
  <!-- Rotation Direction Arrows -->
  <path d="M 470 260 A 90 24 0 0 1 500 280" fill="none" stroke="#FFFFFF" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="505,285 500,270 490,282" fill="#FFFFFF"/>
  
  <!-- Stellite Seat Contact Rings -->
  <ellipse cx="400" cy="310" rx="125" ry="36" fill="none" stroke="#F5B94A" stroke-width="5" stroke-dasharray="10 5"/>
  <text x="400" y="380" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2EDF8" text-anchor="middle" letter-spacing="2">STELLITE SEAT BLUE CONTACT > 95%</text>

  <!-- Badge -->
  <rect x="40" y="40" width="260" height="52" rx="10" fill="rgba(11,32,56,0.85)" stroke="rgba(245,185,74,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5B94A" letter-spacing="1.5">IN-SITU LAPPING</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">MSV / CV Critical Seat Repair</text>
