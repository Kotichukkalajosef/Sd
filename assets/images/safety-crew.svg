<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B2038"/><stop offset="100%" stop-color="#194873"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Safety Helmets & Tech Personnel Silhouettes -->
  <!-- Lead Engineer (Center) -->
  <g transform="translate(400, 260)">
    <!-- Helmet -->
    <path d="M -30 -60 Q 0 -85 30 -60 L 34 -48 L -34 -48 Z" fill="#F5B94A"/>
    <rect x="-38" y="-48" width="76" height="8" rx="3" fill="#D99B26"/>
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="20" ry="22" fill="#E2EDF8"/>
    <!-- Body / Hi-Vis Jacket -->
    <path d="M -45 5 L -35 -10 L 35 -10 L 45 5 L 50 140 L -50 140 Z" fill="#205380"/>
    <!-- Reflective Stripes -->
    <rect x="-42" y="30" width="84" height="12" fill="#F5B94A"/>
    <rect x="-44" y="60" width="88" height="12" fill="#F5B94A"/>
    <!-- Clipboard/Tablet -->
    <rect x="-20" y="50" width="40" height="50" rx="4" fill="#FFFFFF"/>
    <line x1="-12" y1="65" x2="12" y2="65" stroke="#0B2038" stroke-width="2"/>
    <line x1="-12" y1="75" x2="12" y2="75" stroke="#0B2038" stroke-width="2"/>
  </g>
  
  <!-- Specialist Left -->
  <g transform="translate(250, 280)">
    <path d="M -26 -50 Q 0 -72 26 -50 L 30 -40 L -30 -40 Z" fill="#FFFFFF"/>
    <rect x="-34" y="-40" width="68" height="7" rx="3" fill="#CCCCCC"/>
    <ellipse cx="0" cy="-24" rx="17" ry="19" fill="#C5D7E8"/>
    <path d="M -38 5 L -30 -8 L 30 -8 L 38 5 L 42 120 L -42 120 Z" fill="#1A446C"/>
    <rect x="-35" y="35" width="70" height="10" fill="#F5B94A"/>
  </g>
  
  <!-- Specialist Right -->
  <g transform="translate(550, 280)">
    <path d="M -26 -50 Q 0 -72 26 -50 L 30 -40 L -30 -40 Z" fill="#FFFFFF"/>
    <rect x="-34" y="-40" width="68" height="7" rx="3" fill="#CCCCCC"/>
    <ellipse cx="0" cy="-24" rx="17" ry="19" fill="#C5D7E8"/>
    <path d="M -38 5 L -30 -8 L 30 -8 L 38 5 L 42 120 L -42 120 Z" fill="#1A446C"/>
    <rect x="-35" y="35" width="70" height="10" fill="#F5B94A"/>
  </g>
  
  <!-- Safety Banner / Checkmark -->
  <rect x="260" y="420" width="280" height="40" rx="20" fill="rgba(245,185,74,0.15)" stroke="#F5B94A" stroke-width="1.5"/>
  <text x="400" y="445" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5B94A" text-anchor="middle" letter-spacing="1.5">✓ 0 LTI · PERMIT TO WORK VERIFIED</text>

  <!-- Badge -->
  <rect x="40" y="40" width="260" height="52" rx="10" fill="rgba(11,32,56,0.85)" stroke="rgba(245,185,74,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5B94A" letter-spacing="1.5">SPECIALIZED MANPOWER</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Shutdown Crews &amp; Safety</text>
</svg>
