<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#091E33"/><stop offset="100%" stop-color="#12446F"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Diaphragm Half Ring -->
  <g transform="translate(400, 360)">
    <!-- Outer Rim -->
    <path d="M -300 0 A 300 300 0 0 1 300 0" fill="none" stroke="#688FAA" stroke-width="36"/>
    <!-- Inner Rim -->
    <path d="M -160 0 A 160 160 0 0 1 160 0" fill="none" stroke="#254D71" stroke-width="28"/>
    <!-- Fixed Guide Vanes / Nozzles Array -->
    <g stroke="#F5B94A" stroke-width="6" stroke-linecap="round">
      <line x1="-280" y1="-30" x2="-150" y2="-20"/>
      <line x1="-260" y1="-75" x2="-140" y2="-45"/>
      <line x1="-235" y1="-120" x2="-125" y2="-70"/>
      <line x1="-200" y1="-165" x2="-105" y2="-95"/>
      <line x1="-155" y1="-205" x2="-80" y2="-120"/>
      <line x1="-105" y1="-240" x2="-55" y2="-140"/>
      <line x1="-50" y1="-265" x2="-25" y2="-155"/>
      <line x1="0" y1="-275" x2="0" y2="-160"/>
      <line x1="50" y1="-265" x2="25" y2="-155"/>
      <line x1="105" y1="-240" x2="55" y2="-140"/>
      <line x1="155" y1="-205" x2="80" y2="-120"/>
      <line x1="200" y1="-165" x2="105" y2="-95"/>
      <line x1="235" y1="-120" x2="125" y2="-70"/>
      <line x1="260" y1="-75" x2="140" y2="-45"/>
      <line x1="280" y1="-30" x2="150" y2="-20"/>
    </g>
    <!-- Labyrinth Packing Carrier -->
    <path d="M -140 0 A 140 140 0 0 1 140 0" fill="none" stroke="#E2EDF8" stroke-width="6" stroke-dasharray="8 6"/>
  </g>
  
  <!-- Optical Micrometer Tooling -->
  <circle cx="400" cy="200" r="12" fill="#F5B94A"/>
  <line x1="400" y1="200" x2="400" y2="120" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="400" cy="115" r="5" fill="#FFFFFF"/>
  <text x="420" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F5B94A">RADIAL GAP: 0.85 mm</text>

  <!-- Badge -->
  <rect x="40" y="40" width="280" height="52" rx="10" fill="rgba(11,32,56,0.85)" stroke="rgba(245,185,74,0.4)" stroke-width="1"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5B94A" letter-spacing="1.5">METROLOGY &amp; CLEARANCES</text>
  <text x="56" y="80" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Diaphragm Nozzle Alignment</text>
</svg>
